services:
  web:
    image: nginx:alpine
    container_name: xmr-web-miner
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: xmr-miner-proxy
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - WALLET=YOUR_WALLET_ADDRESS_HERE
      - POOL_HOST=pool.supportxmr.com
      - POOL_PORT=7777
      - POOL_SSL=false
      - PROXY_PORT=8081
      - DIFF=5000
    restart: unless-stopped
